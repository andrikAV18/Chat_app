<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Deep Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-container">
        <h2>Register</h2>
        <form class="login-form" action="/register" method="post">
            <input type="text" name="username" placeholder="Choose Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Choose Password" required>
            <button type="submit" class="login-btn">Sign Up</button>
        </form>
        <p style="margin-top: 10px; font-size: 0.8rem; color: #888;">
            Already have an account? <a href="/login.html"
                style="color: var(--primary-light); text-decoration: none;">Login here</a>
        </p>
    </div>
</body>

</html>
