# Render Production Profile
# Activate with: SPRING_PROFILES_ACTIVE=render

spring.application.name=chat-app
server.port=${PORT:8080}

# Database will be configured by DatabaseConfig.java
# which converts Render's postgres:// URL to JDBC format

# Connection pool optimized for free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging - reduced for production
logging.level.root=WARN
logging.level.com.chat.app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
