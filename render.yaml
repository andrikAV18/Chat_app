services:
  - type: web
    name: chat-app
    runtime: docker
    repo: https://github.com/sujan58/Chat_app
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-app-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: render

databases:
  - name: chat-app-db
    plan: free
    databaseName: chatapp
    user: chatapp_user
